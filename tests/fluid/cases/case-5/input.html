<html>
  <head>
    <meta charset="UTF-8" />
    <title>Fluid Sizing - New Utilities Test</title>
  </head>

  <body>
    <!-- Scroll padding utilities -->
    <section id="scroll-padding">
      <div
        class="fluid-scroll-p-min-10 fluid-scroll-p-max-20"
        scroll-p-min-10=""
        scroll-p-max-20=""
      ></div>
      <div
        class="fluid-scroll-px-min-10 fluid-scroll-px-max-20"
        scroll-px-min-10=""
        scroll-px-max-20=""
      ></div>
      <div
        class="fluid-scroll-py-min-10 fluid-scroll-py-max-20"
        scroll-py-min-10=""
        scroll-py-max-20=""
      ></div>
      <div
        class="fluid-scroll-pt-min-10 fluid-scroll-pt-max-20 fluid-scroll-pb-min-10 fluid-scroll-pb-max-20 fluid-scroll-pl-min-10 fluid-scroll-pl-max-20 fluid-scroll-pr-min-10 fluid-scroll-pr-max-20"
        scroll-pt-min-10=""
        scroll-pt-max-20=""
        scroll-pb-min-10=""
        scroll-pb-max-20=""
        scroll-pl-min-10=""
        scroll-pl-max-20=""
        scroll-pr-min-10=""
        scroll-pr-max-20=""
      ></div>
    </section>

    <!-- Scroll margin utilities -->
    <section id="scroll-margin">
      <div
        class="fluid-scroll-m-min-10 fluid-scroll-m-max-20"
        scroll-m-min-10=""
        scroll-m-max-20=""
      ></div>
      <div
        class="fluid-scroll-mx-min-10 fluid-scroll-mx-max-20"
        scroll-mx-min-10=""
        scroll-mx-max-20=""
      ></div>
      <div
        class="fluid-scroll-my-min-10 fluid-scroll-my-max-20"
        scroll-my-min-10=""
        scroll-my-max-20=""
      ></div>
      <div
        class="fluid-scroll-mt-min-10 fluid-scroll-mt-max-20 fluid-scroll-mb-min-10 fluid-scroll-mb-max-20 fluid-scroll-ml-min-10 fluid-scroll-ml-max-20 fluid-scroll-mr-min-10 fluid-scroll-mr-max-20"
        scroll-mt-min-10=""
        scroll-mt-max-20=""
        scroll-mb-min-10=""
        scroll-mb-max-20=""
        scroll-ml-min-10=""
        scroll-ml-max-20=""
        scroll-mr-min-10=""
        scroll-mr-max-20=""
      ></div>
    </section>

    <!-- Border width utilities -->
    <section id="border-width">
      <div
        class="fluid-border-min-1 fluid-border-max-4"
        border-min-1=""
        border-max-4=""
      ></div>
      <div
        class="fluid-border-x-min-1 fluid-border-x-max-4"
        border-x-min-1=""
        border-x-max-4=""
      ></div>
      <div
        class="fluid-border-y-min-1 fluid-border-y-max-4"
        border-y-min-1=""
        border-y-max-4=""
      ></div>
      <div
        class="fluid-border-t-min-1 fluid-border-t-max-4 fluid-border-b-min-1 fluid-border-b-max-4 fluid-border-l-min-1 fluid-border-l-max-4 fluid-border-r-min-1 fluid-border-r-max-4"
        border-t-min-1=""
        border-t-max-4=""
        border-b-min-1=""
        border-b-max-4=""
        border-l-min-1=""
        border-l-max-4=""
        border-r-min-1=""
        border-r-max-4=""
      ></div>
    </section>

    <!-- Outline utilities -->
    <section id="outline">
      <div
        class="fluid-outline-min-1 fluid-outline-max-4"
        outline-min-1=""
        outline-max-4=""
      ></div>
      <div
        class="fluid-outline-offset-min-2 fluid-outline-offset-max-8"
        outline-offset-min-2=""
        outline-offset-max-8=""
      ></div>
    </section>

    <!-- Inset utilities (positioning) -->
    <section id="inset">
      <div
        class="fluid-inset-min-0 fluid-inset-max-100"
        inset-min-0=""
        inset-max-100=""
      ></div>
      <div
        class="fluid-inset-x-min-0 fluid-inset-x-max-100"
        inset-x-min-0=""
        inset-x-max-100=""
      ></div>
      <div
        class="fluid-inset-y-min-0 fluid-inset-y-max-100"
        inset-y-min-0=""
        inset-y-max-100=""
      ></div>
    </section>

    <!-- Space utilities -->
    <section id="space">
      <div
        class="fluid-space-x-min-4 fluid-space-x-max-12"
        space-x-min-4=""
        space-x-max-12=""
      ></div>
      <div
        class="fluid-space-y-min-4 fluid-space-y-max-12"
        space-y-min-4=""
        space-y-max-12=""
      ></div>
      <div class="fluid-space-x-4/12"><span>A</span><span>B</span></div>
      <div class="fluid-space-y-8/16">
        <div>A</div>
        <div>B</div>
      </div>
    </section>

    <!-- Filter utilities -->
    <section id="filter">
      <div
        class="fluid-blur-min-2 fluid-blur-max-8"
        blur-min-2=""
        blur-max-8=""
      ></div>
      <div
        class="fluid-backdrop-blur-min-2 fluid-backdrop-blur-max-8"
        backdrop-blur-min-2=""
        backdrop-blur-max-8=""
      ></div>
    </section>

    <!-- Layout utilities -->
    <section id="layout">
      <div
        class="fluid-basis-min-100 fluid-basis-max-300"
        basis-min-100=""
        basis-max-300=""
      ></div>
      <div
        class="fluid-indent-min-4 fluid-indent-max-12"
        indent-min-4=""
        indent-max-12=""
      ></div>
    </section>

    <!-- Column utilities -->
    <section id="columns">
      <div
        class="fluid-column-gap-min-4 fluid-column-gap-max-12"
        column-gap-min-4=""
        column-gap-max-12=""
      ></div>
    </section>

    <!-- Theme shortcuts with new utilities -->
    <section id="theme-shortcuts">
      <div
        class="fluid-scroll-p-xs fluid-scroll-p-sm fluid-scroll-p-md fluid-scroll-p-lg fluid-scroll-p-xl"
        scroll-p-xs=""
        scroll-p-sm=""
        scroll-p-md=""
        scroll-p-lg=""
        scroll-p-xl=""
      ></div>
      <div
        class="fluid-border-xs fluid-border-sm fluid-border-md fluid-border-lg fluid-border-xl"
        border-xs=""
        border-sm=""
        border-md=""
        border-lg=""
        border-xl=""
      ></div>
    </section>

    <!-- Direct min/max combinations -->
    <section id="direct-combinations">
      <div class="fluid-scroll-p-10/20"></div>
      <div class="fluid-border-1/4"></div>
      <div class="fluid-outline-2/4"></div>
      <div class="fluid-inset-0/100"></div>
    </section>

    <!-- Complex combinations -->
    <section id="complex-combinations">
      <div
        class="fluid-scroll-p-md fluid-border-sm fluid-outline-lg fluid-inset-x-md"
        scroll-p-md=""
        border-sm=""
        outline-lg=""
        inset-x-md=""
      ></div>
      <div
        class="fluid-scroll-p-10/20 fluid-border-1/4 fluid-inset-0/100"
      ></div>
    </section>
  </body>
</html>
